<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F26A21">
<title>Caldeirão de Marés</title>
<style>
  :root{--laranja:#F26A21;--laranja-claro:#FF8A47;--laranja-bg:#FFF3EC;--texto:#1a1a1a;--cinza:#8a8a8a;--linha:#eee;--azul:#3a86c8;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:#fff;color:var(--texto);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:90px;}
  header{background:var(--laranja);color:#fff;padding:14px 18px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  header .marca{display:flex;align-items:center;gap:11px;}
  header .marca img.logo{width:54px;height:54px;border-radius:50%;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.2);background:#fff;}
  header h1{font-size:21px;font-weight:800;letter-spacing:.3px;line-height:1.05;}
  header .sub{font-size:12px;opacity:.9;margin-top:3px;}
  .tabs{display:flex;position:relative;background:var(--laranja);box-shadow:0 2px 6px rgba(0,0,0,.1);position:sticky;top:0;z-index:15;}
  .tab{flex:1;background:none;border:none;color:#fff;opacity:.65;padding:13px 8px;font-weight:800;font-size:15px;cursor:pointer;transition:opacity .2s;}
  .tab.active{opacity:1;}
  .tab-ind{position:absolute;bottom:0;left:0;height:3px;width:50%;background:#fff;border-radius:3px 3px 0 0;transition:transform .3s;}
  .controls{padding:12px 14px;background:var(--laranja-bg);border-bottom:1px solid #f2ddce;}
  .row{display:flex;gap:8px;margin-bottom:8px;} .row:last-child{margin-bottom:0;}
  input,select,button{font-size:15px;font-family:inherit;border-radius:10px;border:1px solid #e6c9b5;padding:11px 12px;background:#fff;color:var(--texto);outline:none;}
  input:focus,select:focus{border-color:var(--laranja);}
  #busca{flex:1;}
  #btnBuscar,#btnLocal{background:var(--laranja);color:#fff;border:none;font-weight:700;padding:11px 14px;white-space:nowrap;cursor:pointer;}
  #btnBuscar:active,#btnLocal:active{background:#d95a15;}
  #data{flex:1;} #favoritos{flex:1;}
  #sugestoes{list-style:none;background:#fff;border:1px solid var(--linha);border-radius:10px;margin:4px 14px 0;overflow:hidden;display:none;}
  #sugestoes li{padding:11px 13px;border-bottom:1px solid var(--linha);cursor:pointer;font-size:14px;}
  #sugestoes li:last-child{border-bottom:none;} #sugestoes li:active{background:var(--laranja-bg);}
  #sugestoes .peq{color:var(--cinza);font-size:12px;}
  .viewport{overflow:hidden;}
  .slides{display:flex;width:200%;transition:transform .3s ease;}
  .slide{width:50%;}
  .titulo{padding:16px 18px 6px;} .titulo h2{font-size:23px;font-weight:800;}
  .colhead{display:flex;align-items:center;padding:8px 18px;color:var(--cinza);font-size:12.5px;font-weight:700;letter-spacing:.5px;border-bottom:1px solid var(--linha);}
  .colhead .c-hora{width:64px;} .colhead .c-alt{width:56px;} .colhead .c-bar{flex:1;} .colhead .c-coef{width:44px;text-align:right;}
  .linha{display:flex;align-items:center;padding:13px 18px;border-bottom:1px solid var(--linha);}
  .linha.agora{background:var(--laranja-bg);}
  .linha .hora{width:64px;font-size:19px;font-weight:600;}
  .linha .alt{width:56px;font-size:19px;font-weight:600;}
  .linha .barwrap{flex:1;padding:0 6px;}
  .linha .bar{height:26px;background:var(--laranja);border-radius:5px;min-width:6px;}
  .linha .coef{width:44px;text-align:right;font-size:19px;font-weight:600;color:#555;}
  .nota{padding:10px 18px 4px;font-size:11px;color:var(--cinza);text-align:center;line-height:1.4;}
  .clima-top{margin:14px 14px 4px;background:var(--laranja-bg);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:14px;}
  .clima-top .ic{font-size:52px;line-height:1;}
  .clima-top .temp{font-size:40px;font-weight:800;line-height:1;}
  .clima-top .desc{font-size:14px;color:#555;margin-top:4px;}
  .clima-top .mm{font-size:13px;color:#777;margin-top:2px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px 0;}
  .card{border:1px solid var(--linha);border-radius:14px;padding:12px 13px;}
  .card .lab{font-size:11px;color:var(--cinza);font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:5px;}
  .card .val{font-size:22px;font-weight:800;margin-top:4px;}
  .card .val small{font-size:12.5px;font-weight:600;color:#777;}
  .faixa-tit{padding:18px 16px 8px;font-weight:800;font-size:15px;}
  .faixa{display:flex;overflow-x:auto;gap:8px;padding:0 14px 10px;-webkit-overflow-scrolling:touch;}
  .hchip{flex:0 0 auto;width:62px;text-align:center;border:1px solid var(--linha);border-radius:12px;padding:9px 4px;}
  .hchip .h{font-size:12px;color:#666;} .hchip .i{font-size:20px;margin:3px 0;}
  .hchip .t{font-weight:800;} .hchip .p{font-size:11px;color:var(--azul);margin-top:2px;min-height:14px;}
  .msg{padding:40px 20px;text-align:center;color:var(--cinza);font-size:15px;line-height:1.5;}
  .spin{display:inline-block;width:26px;height:26px;border:3px solid #f0d3c0;border-top-color:var(--laranja);border-radius:50%;animation:g .8s linear infinite;}
  @keyframes g{to{transform:rotate(360deg)}}
  .footer{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--linha);display:flex;padding:14px 18px;font-size:17px;font-weight:700;box-shadow:0 -2px 10px rgba(0,0,0,.05);}
  .footer .local{flex:1;display:flex;align-items:center;gap:7px;min-width:0;}
  .footer .local span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .footer .local svg{fill:var(--laranja);flex-shrink:0;}
  .footer .data{color:#444;flex-shrink:0;}
</style>
</head>

const FAVORITOS=[

const DIRS=["N","NE","L","SE","S","SO","O","NO"];
function dirVento(g){return DIRS[Math.round(g/45)%8];}
function avg(a){const v=a.filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;}
function isoLocal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function atualizarData(){const [Y,M,D]=el('data').value.split('-');el('dataLabel').textContent=`${D} ${MESES[+M-1]} ${Y}`;}

function wmo(c,dia){
  const M={0:["Céu limpo",dia?"☀️":"🌙"],1:["Predom. limpo",dia?"🌤️":"🌙"],2:["Parcial. nublado","⛅"],3:["Nublado","☁️"],

  return M[c]||["—","🌡️"];
}

function init(){
  const sel=el('favoritos');
  FAVORITOS.forEach((f,i)=>{const o=document.createElement('option');o.value=i;o.textContent=f.nome;sel.appendChild(o);});
  const hoje=new Date(), di=el('data');
  di.value=isoLocal(hoje); di.min=isoLocal(hoje);
  const mx=new Date(hoje); mx.setDate(mx.getDate()+15); di.max=isoLocal(mx);
  sel.addEventListener('change',()=>{if(sel.value!==''){atual=FAVORITOS[+sel.value];carregar();}});
  di.addEventListener('change',()=>{atualizarData();renderMares();renderClima();});
  el('btnBuscar').addEventListener('click',fazerBusca);
  el('busca').addEventListener('keydown',e=>{if(e.key==='Enter')fazerBusca();});
  el('btnLocal').addEventListener('click',usarLocalizacao);
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setAba(+b.dataset.i)));
  const vp=document.querySelector('.viewport'); let x0=null,y0=null;
  vp.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  vp.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){if(dx<0)setAba(1);else setAba(0);}x0=null;},{passive:true});
  carregar();
}
function setAba(i){aba=i;el('slides').style.transform=`translateX(${i?'-50%':'0'})`;el('tabInd').style.transform=`translateX(${i?'100%':'0'})`;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.i===i));}

async function fazerBusca(){
  const q=el('busca').value.trim(); if(!q)return;
  const ul=el('sugestoes'); ul.style.display='block'; ul.innerHTML='<li>Buscando…</li>';
  try{
    const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=pt&format=json`)).json();
    if(!j.results||!j.results.length){ul.innerHTML='<li>Nada encontrado. Tente outro nome.</li>';return;}
    ul.innerHTML='';
    j.results.forEach(res=>{
      const li=document.createElement('li');
      li.innerHTML=`${res.name} <span class="peq">${[res.admin1,res.country].filter(Boolean).join(' · ')}</span>`;
      li.onclick=()=>{atual={nome:`${res.name}${res.admin1?', '+(res.admin1.length>14?res.admin1.slice(0,12)+'…':res.admin1):''}`,lat:res.latitude,lon:res.longitude};ul.style.display='none';ul.innerHTML='';el('busca').value='';el('favoritos').value='';carregar();};
      ul.appendChild(li);
    });
  }catch(e){ul.innerHTML='<li>Erro na busca. Verifique a internet.</li>';}
}
function usarLocalizacao(){
  if(!navigator.geolocation){alert('Localização não suportada.');return;}
  el('btnLocal').textContent='…';
  navigator.geolocation.getCurrentPosition(
    p=>{atual={nome:'Minha localização',lat:p.coords.latitude,lon:p.coords.longitude};el('favoritos').value='';el('btnLocal').textContent='📍';carregar();},
    ()=>{el('btnLocal').textContent='📍';alert('Não foi possível obter a localização.');});
}

function carregar(){
  el('localNome').textContent=atual.nome; atualizarData();
  el('tabela').innerHTML='<div class="msg"><span class="spin"></span><br><br>Carregando marés…</div>';
  el('clima').innerHTML='<div class="msg"><span class="spin"></span><br><br>Carregando clima…</div>';
  carregarMares(); carregarClima();
}

// ---------- MARÉS: tábua real (TideCheck) com fallback ----------
async function carregarMares(){
  if(!CHAVE_TIDECHECK){ return carregarMaresOM(); }
  try{
    const ck=`${atual.lat.toFixed(3)},${atual.lon.toFixed(3)}`;
    let st=stationCache[ck];
    if(!st){
      const nr=await fetch(`https://tidecheck.com/api/stations/nearest?lat=${atual.lat}&lng=${atual.lon}`,{headers:{'X-API-Key':CHAVE_TIDECHECK}});
      if(nr.status===401||nr.status===403)throw{t:'auth'};
      if(nr.status===429)throw{t:'lim'};
      const nj=await nr.json();
      const arr=nj.stations||nj.results||nj.nearest||(Array.isArray(nj)?nj:[]);
      const s0=arr[0]||nj.station;
      if(!s0||!s0.id)throw{t:'est'};
      st={id:s0.id,name:s0.name||''}; stationCache[ck]=st;
    }
    const tr=await fetch(`https://tidecheck.com/api/station/${st.id}/tides?days=16&datum=LAT&start=${isoLocal(new Date())}`,{headers:{'X-API-Key':CHAVE_TIDECHECK}});
    if(tr.status===429)throw{t:'lim'};
    if(!tr.ok)throw{t:'erro'};
    const tj=await tr.json();
    if(!tj.extremes||!tj.extremes.length)throw{t:'dados'};
    const ex=tj.extremes.map(e=>({t:new Date(e.localTime).getTime(),h:e.height,d:e.localTime.slice(0,10)}));
    // coeficiente estimado por dia (amplitude na janela -> escala 20-118)
    const porDia={}; ex.forEach(e=>{(porDia[e.d]=porDia[e.d]||[]).push(e.h);});
    let aMin=Infinity,aMax=-Infinity; const amps={};
    for(const d in porDia){const v=porDia[d];const a=Math.max(...v)-Math.min(...v);amps[d]=a;aMin=Math.min(aMin,a);aMax=Math.max(aMax,a);}
    const coefPorDia={}; for(const d in amps){const n=(aMax===aMin)?0.6:(amps[d]-aMin)/(aMax-aMin);coefPorDia[d]=Math.round(20+n*(118-20));}
    maresCache={modo:'tabua',ex,coefPorDia,offStr:tj.extremes[0].localTime.slice(-6),station:st.name};
    renderMares();
  }catch(err){
    let m='Não foi possível carregar a tábua real. Mostrando estimativa.';
    if(err.t==='auth')m='Chave da TideCheck inválida — confira a chave colada no código.';
    else if(err.t==='lim')m='Limite grátis de hoje atingido (50 consultas/dia). Volta a funcionar amanhã.';
    else if(err.t==='est'||err.t==='dados')m='Sem estação de maré próxima deste ponto. Mostrando estimativa.';
    if(err.t==='auth'||err.t==='lim'){ el('tabela').innerHTML=`<div class="msg">${m}</div>`; el('notaMares').textContent=''; return; }
    carregarMaresOM(); el('notaMares').textContent=m;
  }
}

function interpola(ex,alvo){
  let prev=null,next=null;
  for(const e of ex){if(e.t<=alvo)prev=e;if(e.t>=alvo){next=e;break;}}
  if(prev&&next&&prev!==next){const f=(alvo-prev.t)/(next.t-prev.t);return (prev.h+next.h)/2+(prev.h-next.h)/2*Math.cos(Math.PI*f);}
  return (prev||next).h;
}

function renderMares(){
  if(!maresCache)return;
  if(maresCache.modo==='tabua')renderMaresTabua();
  else renderMaresOM();
}

function renderMaresTabua(){
  const ds=el('data').value, {ex,coefPorDia,offStr,station}=maresCache;
  const hs=[];
  for(let h=0;h<24;h++){const alvo=new Date(`${ds}T${String(h).padStart(2,'0')}:00:00${offStr}`).getTime();hs.push(interpola(ex,alvo));}
  const max=Math.max(...hs), coef=coefPorDia[ds]??'—';
  const agoraH=new Date().getHours(), eHoje=ds===isoLocal(new Date());
  let html='';
  for(let h=0;h<24;h++){
    const alt=Math.max(0,hs[h]), larg=Math.max(4,(alt/(max||1))*88);
    const cls=(eHoje&&h===agoraH)?'linha agora':'linha';
    html+=`<div class="${cls}"><span class="hora">${String(h).padStart(2,'0')}:00</span><span class="alt">${alt.toFixed(1)}</span><span class="barwrap"><div class="bar" style="width:${larg.toFixed(0)}%"></div></span><span class="coef">${coef}</span></div>`;
  }
  el('tabela').innerHTML=html;
  el('notaMares').innerHTML=`Tábua harmônica (TideCheck) · referência LAT (zero da carta)${station?' · estação '+station:''}. Coeficiente estimado.`;
}

// ---------- MARÉS: fallback Open-Meteo (estimativa) ----------
async function carregarMaresOM(){
  try{
    const j=await (await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${atual.lat}&longitude=${atual.lon}&hourly=sea_level_height_msl&timezone=auto&forecast_days=16&cell_selection=sea`)).json();
    if(!j.hourly||!j.hourly.sea_level_height_msl)throw 0;
    const times=j.hourly.time, niveis=j.hourly.sea_level_height_msl, porDia={};
    times.forEach((t,i)=>{const d=t.slice(0,10);(porDia[d]=porDia[d]||[]).push(niveis[i]);});
    let aMin=Infinity,aMax=-Infinity; const amps={};
    for(const d in porDia){const v=porDia[d].filter(x=>x!=null);if(!v.length){amps[d]=null;continue;}const a=Math.max(...v)-Math.min(...v);amps[d]=a;aMin=Math.min(aMin,a);aMax=Math.max(aMax,a);}
    const coefPorDia={}; for(const d in amps){if(amps[d]==null){coefPorDia[d]=null;continue;}const n=(aMax===aMin)?0.6:(amps[d]-aMin)/(aMax-aMin);coefPorDia[d]=Math.round(20+n*(118-20));}
    maresCache={modo:'om',times,niveis,coefPorDia}; renderMares();
    if(!el('notaMares').textContent) el('notaMares').innerHTML=CHAVE_TIDECHECK?'':'Estimativa (modelo global). Para bater com a tábua oficial, cole sua chave grátis da TideCheck no código.';
  }catch(e){el('tabela').innerHTML='<div class="msg">Não há previsão de maré para este ponto (pode ser distante do mar).<br><br>Tente uma cidade litorânea.</div>';el('notaMares').textContent='';}
}
function renderMaresOM(){
  const ds=el('data').value, {times,niveis,coefPorDia}=maresCache, idxs=[];
  times.forEach((t,i)=>{if(t.slice(0,10)===ds)idxs.push(i);});
  if(!idxs.length){el('tabela').innerHTML='<div class="msg">Sem dados para esta data.</div>';return;}
  const vals=idxs.map(i=>niveis[i]), min=Math.min(...vals), max=Math.max(...vals);
  const off=(min<0.2)?(0.2-min):0, maxReal=max+off, coef=coefPorDia[ds];
  const agoraH=new Date().getHours(), eHoje=ds===isoLocal(new Date());
  let html='';
  idxs.forEach(i=>{const hora=times[i].slice(11,16),h=+times[i].slice(11,13),altR=niveis[i]+off,larg=Math.max(4,(altR/maxReal)*88),cls=(eHoje&&h===agoraH)?'linha agora':'linha';
    html+=`<div class="${cls}"><span class="hora">${hora}</span><span class="alt">${altR.toFixed(1)}</span><span class="barwrap"><div class="bar" style="width:${larg.toFixed(0)}%"></div></span><span class="coef">${coef??'—'}</span></div>`;});
  el('tabela').innerHTML=html;
}

// ---------- CLIMA (Open-Meteo) ----------
async function carregarClima(){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${atual.lat}&longitude=${atual.lon}`
      +`&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m`
      +`&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code,surface_pressure,wind_speed_10m,uv_index,visibility`
      +`&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant`
      +`&timezone=auto&forecast_days=16&wind_speed_unit=kmh`;
    climaCache=await (await fetch(url)).json();
    if(!climaCache.daily)throw 0;
    renderClima();
  }catch(e){el('clima').innerHTML='<div class="msg">Não foi possível carregar o clima deste local.</div>';}
}
function renderClima(){
  if(!climaCache||!climaCache.daily)return;
  const ds=el('data').value, c=climaCache, d=c.daily, di=d.time.indexOf(ds);
  if(di<0){el('clima').innerHTML='<div class="msg">Sem dados de clima para esta data.</div>';return;}
  const eHoje=ds===isoLocal(new Date());
  const hi=[]; c.hourly.time.forEach((t,i)=>{if(t.slice(0,10)===ds)hi.push(i);});
  const umidDia=Math.round(avg(hi.map(i=>c.hourly.relative_humidity_2m[i]))||0);
  const pressDia=Math.round(avg(hi.map(i=>c.hourly.surface_pressure[i]))||0);
  const visDia=avg(hi.map(i=>c.hourly.visibility[i]));
  let icTemp,desc,ic,mm;
  if(eHoje&&c.current){const w=wmo(c.current.weather_code,c.current.is_day===1);ic=w[1];desc=w[0];icTemp=Math.round(c.current.temperature_2m);mm=`Sensação ${Math.round(c.current.apparent_temperature)}° · máx ${Math.round(d.temperature_2m_max[di])}° / mín ${Math.round(d.temperature_2m_min[di])}°`;}
  else{const w=wmo(d.weather_code[di],true);ic=w[1];desc=w[0];icTemp=Math.round(d.temperature_2m_max[di]);mm=`mín ${Math.round(d.temperature_2m_min[di])}° · sensação até ${Math.round(d.apparent_temperature_max[di])}°`;}
  const cards=[
    ['💧 Umidade',`${eHoje&&c.current?Math.round(c.current.relative_humidity_2m):umidDia}<small>%</small>`],
    ['💨 Vento',`${Math.round(d.wind_speed_10m_max[di])}<small> km/h ${dirVento(d.wind_direction_10m_dominant[di])}</small>`],
    ['🌬️ Rajadas',`${Math.round(d.wind_gusts_10m_max[di])}<small> km/h</small>`],
    ['🌧️ Chuva',`${(d.precipitation_sum[di]||0).toFixed(1)}<small> mm · ${d.precipitation_probability_max[di]??0}%</small>`],
    ['🔽 Pressão',`${eHoje&&c.current?Math.round(c.current.surface_pressure):pressDia}<small> hPa</small>`],
    ['☀️ Índice UV',`${Math.round(d.uv_index_max[di]??0)}`],
    ['🌅 Nascer do sol',`${d.sunrise[di].slice(11,16)}`],
    ['🌇 Pôr do sol',`${d.sunset[di].slice(11,16)}`],
  ];
  if(visDia!=null)cards.push(['👁️ Visibilidade',`${(visDia/1000).toFixed(0)}<small> km</small>`]);
  let chips='';
  hi.forEach(i=>{const h=+c.hourly.time[i].slice(11,13),w=wmo(c.hourly.weather_code[i],h>=6&&h<19),p=c.hourly.precipitation_probability[i];
    chips+=`<div class="hchip"><div class="h">${String(h).padStart(2,'0')}h</div><div class="i">${w[1]}</div><div class="t">${Math.round(c.hourly.temperature_2m[i])}°</div><div class="p">${p?p+'%':''}</div></div>`;});
  el('clima').innerHTML=`<div class="clima-top"><div class="ic">${ic}</div><div><div class="temp">${icTemp}°</div><div class="desc">${desc}</div><div class="mm">${mm}</div></div></div>
    <div class="grid">${cards.map(c=>`<div class="card"><div class="lab">${c[0]}</div><div class="val">${c[1]}</div></div>`).join('')}</div>
    <div class="faixa-tit">Hora a hora</div><div class="faixa">${chips}</div>`;
}

init();
</script>
